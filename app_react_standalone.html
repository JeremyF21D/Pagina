    function detectProductCategory(item) {
      if (!item) return 'otro';
      if (item.category) return item.category;
      const text = `${item.id || ''} ${item.name || ''} ${item.type || ''}`.toLowerCase();
      if (text.includes('bob-') || text.includes('bobina')) return 'bobina';
      if (text.includes('iny-') || text.includes('inyector')) return 'inyector';
      if (text.includes('est-') || text.includes('estopera') || text.includes('reten')) return 'estopera';

      if (text.includes('emp-') || text.includes('empacadura') || text.includes('junta')) return 'empacadura';
      return 'otro';
    }

    function generateSmartProductId({ category = 'bobina', name = '', carModel = '', engine = '', brand = '', existingItems = [] } = {}) {
      let prefix = 'BOB';
      const catConfig = PRODUCT_CATEGORIES.find(c => c.id === category);
      if (catConfig) prefix = catConfig.prefix;

      let modelStr = '';
      const rawModel = (carModel || '').trim();
      if (rawModel) {
        const firstChunk = rawModel.split(/[,/\\-]/)[0].trim();
        const words = firstChunk.split(/\s+/).filter(Boolean);
        let primaryWord = words[0] || '';
        if (words.length > 1 && /^(grand|new|super|sport|all)$/i.test(primaryWord)) primaryWord = words[1];
        modelStr = primaryWord.replace(/[^a-zA-Z0-9]/g, '').toUpperCase().slice(0, 7);
      } else if (name) {
        const nameWords = name.replace(/[^a-zA-Z0-9\s]/g, ' ').split(/\s+/);
        const ignoreList = new Set(['BOBINA', 'DE', 'ENCENDIDO', 'INYECTOR', 'ESTOPERA', 'RETEN', 'RETÉN', 'BUJIA', 'BUJÍA', 'SENSOR', 'BOMBA', 'PILA', 'EMPACADURA', 'JUNTA', 'REPUESTO', 'CHEVROLET', 'TOYOTA', 'FORD', 'NISSAN', 'HYUNDAI', 'RENAULT', 'SUZUKI', 'MITSUBISHI', 'KIA', 'ORIGINAL', 'OEM']);
        for (const w of nameWords) {
          const up = w.toUpperCase();
          if (up.length >= 3 && !ignoreList.has(up)) {
            modelStr = up.slice(0, 7);
            break;
          }
        }
      }
      if (!modelStr) {
        const cleanBrand = (brand || '').replace(/[^a-zA-Z]/g, '').toUpperCase();
        modelStr = cleanBrand.slice(0, 4) || 'REP';
      }

      let numStr = '';
      const searchSources = [engine || '', carModel || '', name || ''];
      for (const src of searchSources) {
        if (!src) continue;
        const decMatch = src.match(/(\d+)[.,](\d+)/);
        if (decMatch) { numStr = `${decMatch[1]}${decMatch[2]}`; break; }
        const vMatch = src.match(/(\d+)V\b/i);
        if (vMatch) { numStr = vMatch[1]; break; }
        const intMatch = src.match(/\b(\d{2,3})\b/);
        if (intMatch) { numStr = intMatch[1]; break; }
      }

      const baseId = `${prefix}-${modelStr}${numStr}`;
      let candidate = baseId;
      const isTaken = (testId) => Array.isArray(existingItems) && existingItems.some(i => i && String(i.id).toLowerCase() === testId.toLowerCase());
      if (isTaken(candidate)) {
        let suffix = 2;
        while (isTaken(`${baseId}-${suffix}`) && suffix < 99) suffix++;
        candidate = `${baseId}-${suffix}`;
      }
      return candidate;
    }


    function generateAutoCoilId(existingCoils = [], brand = '') {
      const brandPrefix = brand ? String(brand).replace(/[^a-zA-Z]/g, '').slice(0, 4).toUpperCase() : '';
      const prefix = brandPrefix ? `BOB-${brandPrefix}` : 'BOB';
      let maxNum = 0;
      if (Array.isArray(existingCoils)) {
        existingCoils.forEach(item => {
          if (!item || !item.id) return;
          const match = String(item.id).match(/(\d+)$/);
          if (match) {
            const n = parseInt(match[1], 10);
            if (!isNaN(n) && n > maxNum && n < 100000) maxNum = n;
          }
        });
      }
      const nextNum = maxNum > 0 ? maxNum + 1 : (existingCoils.length ? existingCoils.length + 1 : 1);
      const padded = String(nextNum).padStart(3, '0');
      const candidateId = `${prefix}-${padded}`;
      const exists = Array.isArray(existingCoils) && existingCoils.some(c => String(c.id).toLowerCase() === candidateId.toLowerCase());
      if (exists) {
        const randomSuffix = Math.floor(100 + Math.random() * 900);
        return `${prefix}-${randomSuffix}`;
      }
      return candidateId;
    }

    function normalizeCoilRecord(raw, existingCoils = []) {
      if (!raw || typeof raw !== 'object') return null;
      if (raw.error || raw.message) return null;

      // Price / Precio
      const rawPrice = raw.price ?? raw.precio ?? raw.costo ?? raw.valor ?? raw.precio_usd ?? 25;

      const safePrice = !isNaN(priceVal) && priceVal >= 0 ? priceVal : 25.00;

      // Old Price / Precio Anterior
      const rawOldPrice = raw.oldPrice ?? raw.old_price ?? raw.precio_anterior ?? raw.precio_lista ?? raw.precio_viejo;
      const oldPriceVal = parseFloat(rawOldPrice);
      const safeOldPrice = !isNaN(oldPriceVal) && oldPriceVal > 0 ? oldPriceVal : safePrice;

      // Stock / Cantidad
      const rawStock = raw.stock ?? raw.cantidad ?? raw.existencia ?? raw.inventario ?? raw.unidades ?? raw.qty ?? 0;
      const stockVal = parseInt(rawStock, 10);
      const safeStock = !isNaN(stockVal) && stockVal >= 0 ? stockVal : 0;

      // Brand / Marca
      const brandVal = String(raw.brand ?? raw.marca ?? raw.fabricante ?? 'Chevrolet').trim();

      // ID / Código
      const idVal = String(raw.id ?? raw.ID ?? raw.codigo ?? raw.code ?? raw.id_bobina ?? raw.cod ?? raw._id ?? '').trim();
      const safeId = idVal || generateAutoCoilId(existingCoils, brandVal);

      // Name / Nombre
      const nameVal = String(raw.name ?? raw.nombre ?? raw.title ?? raw.titulo ?? raw.repuesto ?? raw.producto ?? raw.descripcion ?? '').trim();

      // Model / Modelo
      const modelVal = String(raw.carModel ?? raw.car_model ?? raw.modelo ?? raw.aplicacion ?? raw.vehiculo ?? raw.auto ?? 'Multimodelo').trim();

      // Engine / Motor
      const engineVal = String(raw.engine ?? raw.motor ?? raw.cilindrada ?? '1.6L / 2.0L').trim();

      // OEM / Parte
      const oemVal = String(raw.oem ?? raw.codigo_oem ?? raw.oem_code ?? raw.part_number ?? raw.numero_parte ?? 'OEM-STD').trim();

      // Type / Tipo
      const typeVal = String(raw.type ?? raw.tipo ?? 'Tipo Lápiz Individual').trim();

      // Connector / Pines
      const connectorVal = String(raw.connector ?? raw.conector ?? raw.pines ?? 'Conector 4 Pines').trim();

      // Warranty / Garantía
      const warrantyVal = String(raw.warranty ?? raw.garantia ?? '12 meses').trim();

      // Badge / Etiqueta
      const badgeVal = String(raw.badge ?? raw.etiqueta ?? raw.tag ?? 'OEM Spec').trim();

      // Image / Foto
      const rawImage = String(raw.image ?? raw.imageUrl ?? raw.image_url ?? raw.img ?? raw.foto ?? raw.imagen ?? raw.url_imagen ?? '').trim();
      let finalImage = rawImage;
      if (!finalImage && Array.isArray(DEFAULT_BOBINAS_SEED)) {
        const seedMatch = DEFAULT_BOBINAS_SEED.find(s => s.id.toLowerCase() === safeId.toLowerCase() || (s.oem && oemVal && s.oem.toLowerCase().includes(oemVal.toLowerCase())));
        if (seedMatch && seedMatch.image) finalImage = seedMatch.image;

    function parseCSV(csvText) {
      const rows = [];
      let currentRow = [];
      let currentField = '';
      let insideQuotes = false;
      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];
        if (char === '"') {
          if (insideQuotes && nextChar === '"') { currentField += '"'; i++; }
          else insideQuotes = !insideQuotes;
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentField.trim());
          currentField = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          currentRow.push(currentField.trim());
          currentField = '';
          if (currentRow.some(col => col.length > 0)) rows.push(currentRow);
          currentRow = [];
        } else {
          currentField += char;
        }
      }
      if (currentField.length > 0 || currentRow.length > 0) {
        currentRow.push(currentField.trim());
        if (currentRow.some(col => col.length > 0)) rows.push(currentRow);
      }
      if (rows.length < 2) throw new Error('El archivo CSV debe contener al menos cabecera y 1 fila de datos.');
      const headers = rows[0].map(h => h.trim().replace(/^"|"$/g, ''));
      const records = [];
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        const obj = {};
        headers.forEach((h, idx) => { obj[h] = row[idx] !== undefined ? row[idx] : ''; });
        records.push(obj);
      }
      return records;
    }

    function exportToCSV(items) {
      const headers = ['id', 'name', 'brand', 'carModel', 'engine', 'oem', 'type', 'connector', 'price', 'oldPrice', 'stock', 'warranty', 'badge'];
      const escapeField = val => {
        const str = String(val ?? '');
        if (str.includes(',') || str.includes('"') || str.includes('\n')) return `"${str.replace(/"/g, '""')}"`;
        return str;
      };
      const headerRow = headers.join(',');
      const dataRows = items.map(item => headers.map(h => escapeField(item[h])).join(','));
      return [headerRow, ...dataRows].join('\n');
    }

    function exportToSQL(items) {
      const safe = str => String(str ?? '').replace(/'/g, "''");
      const inserts = items.map(b => 
        `INSERT INTO bobinas_inventario (id, name, brand, car_model, engine, oem, type, connector, price, old_price, stock, warranty, badge) VALUES ('${safe(b.id)}', '${safe(b.name)}', '${safe(b.brand)}', '${safe(b.carModel)}', '${safe(b.engine)}', '${safe(b.oem)}', '${safe(b.type)}', '${safe(b.connector)}', ${Number(b.price).toFixed(2)}, ${Number(b.oldPrice || b.price * 1.2).toFixed(2)}, ${b.stock}, '${safe(b.warranty)}', '${safe(b.badge)}');`
      ).join('\n');
      return `-- DUMP SQL BOBINAS EXPRESS\n${inserts}`;
    }

      a.href = url;

                    headers: getSupabaseHeaders(anonKey, { 'Prefer': 'resolution=merge-duplicates,return=representation' }),
                    body: JSON.stringify(fallback)
                  });
                  if (res.ok) {
                    showToast(`⚠️ Repuesto guardado. Para que todos vean la foto, añade la columna 'image' en Supabase.`);
                    setTimeout(() => { if (typeof checkAndSyncDatabase === 'function') checkAndSyncDatabase(dbEngine, null, false); }, 400);
                    return { success: true };
                  }
                }
                showToast(`⚠️ Error al guardar en Supabase: ${errText.slice(0, 80)}`, 'error');
                return { success: false, error: errText };
              } else {
                showToast(`🟢 Repuesto ${item.id} guardado en Supabase`);
                setTimeout(() => { if (typeof checkAndSyncDatabase === 'function') checkAndSyncDatabase(dbEngine, null, false); }, 400);
                return { success: true };
              }
            } catch (err) {
              showToast(`⚠️ Error de conexión: ${err.message}`, 'error');
              return { success: false, error: err.message };
            }
          }
        }
        showToast(`Repuesto ${item.id} guardado`);
        return { success: true };
      };

      const deleteCoil = async (id) => {
        const target = String(id || '').trim();
        if (typeof localStorage !== 'undefined') {
          try {
            const storedImages = JSON.parse(localStorage.getItem('JF_PRODUCT_CUSTOM_IMAGES') || '{}');
            if (storedImages[target]) {
              delete storedImages[target];
              localStorage.setItem('JF_PRODUCT_CUSTOM_IMAGES', JSON.stringify(storedImages));
            }
          } catch (e) {}
        }
        setCoils(prev => {
          const next = prev.filter(b => String(b.id || '').trim().toLowerCase() !== target.toLowerCase());
          try { localStorage.setItem('BOBINAS_EXPRESS_STORE_V5', JSON.stringify(next)); } catch(e) {}
          broadcastSync(next);
          pushToApi(next, dbEngine, dbCredentials);
          return next;
        });

        if (dbEngine === 'supabase') {
          const { baseUrl, anonKey, table } = getActiveSupabaseConfig(null, dbCredentials);
          if (baseUrl && anonKey) {
            try {
              const res = await fetch(`${baseUrl}/rest/v1/${table}?id=eq.${encodeURIComponent(target)}`, {
                method: 'DELETE',
                headers: getSupabaseHeaders(anonKey)
              });
              if (res.ok) {
                showToast(`🗑️ Repuesto ${target} eliminado de Supabase`);
              }
            } catch (e) {}
          }
        } else {
          showToast(`Repuesto ${target} eliminado`);
        }
      };

      const clearInventory = () => {
        setCoils([]);
        try { localStorage.setItem('BOBINAS_EXPRESS_STORE_V5', JSON.stringify([])); } catch(e) {}
        broadcastSync([]);
        pushToApi([], dbEngine, dbCredentials);
        fetch('/api/inventory', { method: 'DELETE' }).catch(() => {});
        showToast('Base de datos vaciada por completo (0 artículos)');
      };

      const restoreSeedData = () => { 
        const fresh = DEFAULT_BOBINAS_SEED.map(normalizeCoilRecord); 
        setCoils(fresh); 
        broadcastSync(fresh);
        pushToApi(fresh);
        showToast('Inventario restaurado'); 
      };

      const bulkImport = (records, replaceAll) => {
        const norm = records.map(normalizeCoilRecord);
        setCoils(prev => {
          let next;
          if (replaceAll) {
            next = norm;
          } else {
            const map = new Map();
            prev.forEach(i => map.set(i.id.toLowerCase(), i));
            norm.forEach(i => map.set(i.id.toLowerCase(), i));
            next = Array.from(map.values());
          }
          broadcastSync(next);
          pushToApi(next);
          return next;
        });
        showToast(`Carga masiva: ${norm.length} productos procesados.`);
      };
            next = Array.from(map.values());
          }
          broadcastSync(next);
          pushToApi(next);
          return next;
        });
        showToast(`Carga masiva: ${norm.length} productos procesados.`);
      };

      const processSaleTransaction = ({ coilId, qty, customerName, customerPhone, paymentRef, userId, status = 'PENDING_APPROVAL' }) => {
        let orderResult = null;
        setCoils(currentCoils => {
          const coil = currentCoils.find(b => b.id === coilId);
          if (!coil) return currentCoils;
          const reqQty = Math.max(1, parseInt(qty, 10) || 1);
          if (coil.stock < reqQty) { showToast(`Stock insuficiente (${coil.stock} uds)`); return currentCoils; }
          const isConfirmed = status === 'CONFIRMED';
          const stockAfter = isConfirmed ? Math.max(0, coil.stock - reqQty) : coil.stock;

          const newOrder = {
            orderId: `ORD-${Math.floor(1000 + Math.random() * 9000)}`,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            userId: userId || 'CLI-GUEST',
            customerName: customerName || 'Cliente WhatsApp Directo',
            customerPhone: customerPhone || 'WhatsApp',
            coilId: coil.id,
            coilName: coil.name,
            oem: coil.oem.split('/')[0].trim(),
            qty: reqQty,
            unitPrice: coil.price,
            totalPrice: Number((coil.price * reqQty).toFixed(2)),
            stockBefore: coil.stock,
            stockAfter,
            paymentRef: paymentRef || 'Confirmación directa',
            status: isConfirmed ? 'CONFIRMED' : 'PENDING_APPROVAL'
          };
          orderResult = newOrder;
          setSalesHistory(prev => [newOrder, ...prev]);
          setPendingOwnerAlert(newOrder);

          if (ownerSettings.soundAlert) {
            try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = ctx.createOscillator(); const gain = ctx.createGain();
              osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime); osc.frequency.setValueAtTime(1318.5, ctx.currentTime + 0.09);
              gain.gain.setValueAtTime(0.12, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
              osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.35);
            } catch(e) {}
          }

          if (!isConfirmed) return currentCoils;
          const nextCoils = currentCoils.map(item => item.id === coil.id ? { ...item, stock: stockAfter, inStock: stockAfter > 0 } : item);
          broadcastSync(nextCoils);
          pushToApi(nextCoils);
          return nextCoils;
        });
        return orderResult;
      };

      const confirmSale = (orderId) => {
        const ord = salesHistory.find(s => s.orderId === orderId);
        if (!ord || ord.status === 'CONFIRMED') return;
        let calculatedStock = null;
        setCoils(currentCoils => {
          const coil = currentCoils.find(b => b.id.toLowerCase() === String(ord.coilId || '').toLowerCase());
          const curStock = coil ? coil.stock : ord.stockBefore;
          const nextStock = Math.max(0, curStock - ord.qty);
          calculatedStock = nextStock;
          const nextCoils = currentCoils.map(item => item.id.toLowerCase() === String(ord.coilId || '').toLowerCase() ? { ...item, stock: nextStock, inStock: nextStock > 0 } : item);
          broadcastSync(nextCoils);
          pushToApi(nextCoils);
          if (dbEngine === 'supabase') {
            const { baseUrl, anonKey, table } = getActiveSupabaseConfig(null, dbCredentials);
            if (baseUrl && anonKey) {
              fetch(`${baseUrl}/rest/v1/${table}?id=eq.${encodeURIComponent(ord.coilId)}`, {
                method: 'PATCH',
                headers: getSupabaseHeaders(anonKey, { 'Prefer': 'return=minimal' }),
                body: JSON.stringify({ stock: nextStock })
              }).catch(() => {});
            }
          }
          return nextCoils;
        });
        setSalesHistory(prev => prev.map(s => s.orderId === orderId ? { ...s, status: 'CONFIRMED', stockAfter: calculatedStock !== null ? calculatedStock : Math.max(0, s.stockBefore - s.qty) } : s));
        showToast(`✅ Pedido #${orderId} confirmado. Se descontaron ${ord.qty} uds de stock.`);
      };

      const revertSale = (orderId) => {
        const ord = salesHistory.find(s => s.orderId === orderId);
        if (!ord || ord.status === 'REVERTED') return;
        const wasConfirmed = ord.status === 'CONFIRMED';
        if (wasConfirmed) {
          let calculatedStock = null;
          setCoils(currentCoils => {
            const coil = currentCoils.find(b => b.id.toLowerCase() === String(ord.coilId || '').toLowerCase());
            const curStock = coil ? coil.stock : (ord.stockAfter || 0);
            const restoredStock = curStock + ord.qty;
            calculatedStock = restoredStock;
            const nextCoils = currentCoils.map(item => item.id.toLowerCase() === String(ord.coilId || '').toLowerCase() ? { ...item, stock: restoredStock, inStock: true } : item);
            broadcastSync(nextCoils);
            pushToApi(nextCoils);
            if (dbEngine === 'supabase') {
              const { baseUrl, anonKey, table } = getActiveSupabaseConfig(null, dbCredentials);
              if (baseUrl && anonKey) {
                fetch(`${baseUrl}/rest/v1/${table}?id=eq.${encodeURIComponent(ord.coilId)}`, {
                  method: 'PATCH',
                  headers: getSupabaseHeaders(anonKey, { 'Prefer': 'return=minimal' }),
                  body: JSON.stringify({ stock: restoredStock })
                }).catch(() => {});
              }
            }
            return nextCoils;
          });
          showToast(`↩️ Venta #${orderId} revertida (+${ord.qty} unidades al stock)`);
        } else {
          showToast(`❌ Orden #${orderId} cancelada (no modificó el stock)`);
        }
        setSalesHistory(prev => prev.map(s => s.orderId === orderId ? { ...s, status: 'REVERTED' } : s));
      };

      const refreshSalesHistory = () => {
        try {
          const s = localStorage.getItem('BOBINAS_EXPRESS_SALES_V4');
          if (s) {
            const parsed = JSON.parse(s);
            if (Array.isArray(parsed)) {
              setSalesHistory(parsed);
              showToast(`✓ Registro de ventas actualizado (${parsed.length} órdenes)`);
              return;
            }
          }
        } catch(e) {}
        showToast(`✓ Registro de ventas al día (${salesHistory.length} órdenes)`);
      };

      const importSalesBatch = (newRecords, replaceAll = false) => {
        setSalesHistory(prev => {
          let next;
          if (replaceAll) {
            next = newRecords;
          } else {
            const existingIds = new Set(prev.map(s => String(s.orderId)));
            const nonDups = newRecords.filter(s => !existingIds.has(String(s.orderId)));
            next = [...nonDups, ...prev];
          }
          try { localStorage.setItem('BOBINAS_EXPRESS_SALES_V4', JSON.stringify(next)); } catch(e) {}
          return next;
        });
        showToast(`✓ ${newRecords.length} ventas importadas y conectadas con el catálogo`);
      };

      return (
        <InventoryContext.Provider value={{ coils, dbEngine, changeDbEngine, dbCredentials, updateDbCredentials, apiConnectionStatus, testApiConnection, syncWithApi, upsertCoil, deleteCoil, clearInventory, restoreSeedData, bulkImport, salesHistory, refreshSalesHistory, importSalesBatch, ownerSettings, updateOwnerSettings, processSaleTransaction, confirmSale, revertSale, pendingOwnerAlert, dismissOwnerAlert: () => setPendingOwnerAlert(null) }}>
          {children}
        </InventoryContext.Provider>
      );
    }

        try {
          const s = localStorage.getItem('AUTOIGNITION_PRIVATE_CARTS_V2');
          if (s) { const p = JSON.parse(s); if (p[deviceId]) return p[deviceId]; }
        } catch(e) {}
        return [];
      });
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [buyerDraft, setBuyerDraft] = useState(() => {
        try { const s = localStorage.getItem('AUTOIGNITION_BUYER_DRAFT_V2'); if (s) return JSON.parse(s); } catch(e) {}
        return { name: '', phone: '', car: '', payRef: '' };
      });

      const persistCart = (newCart) => {
        try {
          const s = localStorage.getItem('AUTOIGNITION_PRIVATE_CARTS_V2');
          const all = s ? JSON.parse(s) : {};
          all[deviceId] = newCart;
          localStorage.setItem('AUTOIGNITION_PRIVATE_CARTS_V2', JSON.stringify(all));
        } catch(e) {}
      };

      const updateBuyerDraft = (fields) => {
        setBuyerDraft(prev => {
          const next = { ...prev, ...fields };
          localStorage.setItem('AUTOIGNITION_BUYER_DRAFT_V2', JSON.stringify(next));
          return next;
        });
      };

      const addToCart = (productId, requestedQty = 1) => {
        const product = coils.find(b => b.id === productId);
        if (!product || product.stock <= 0) { showToast('Sin stock disponible'); return; }
        setCart(prev => {
          const existing = prev.find(i => i.id === productId);
          let next;
          if (existing) {
            if (existing.qty + requestedQty <= product.stock) {
              next = prev.map(i => i.id === productId ? { ...i, qty: i.qty + requestedQty } : i);
              showToast(`Carrito: ${existing.qty + requestedQty}x ${product.name}`);
            } else {
              showToast(`Límite de stock alcanzado (${product.stock} uds)`);
              return prev;
            }
          } else {
            next = [...prev, { id: product.id, name: product.name, price: product.price, oem: product.oem.split('/')[0].trim(), qty: 1, maxStock: product.stock }];
            showToast(`Añadido: ${product.name}`);
          }
          persistCart(next);
          return next;
        });
      };

      const updateCartQty = (productId, delta) => {
        setCart(prev => {
          const product = coils.find(b => b.id === productId);
          const max = product ? product.stock : 99;
          const next = prev.map(item => {
            if (item.id === productId) {
              const n = item.qty + delta;
              return { ...item, qty: Math.min(max, n) };
            }
            return item;
          }).filter(item => item.qty > 0);
          persistCart(next);
          return next;
        });
      };

      const removeFromCart = (id) => {
        setCart(prev => {
          const next = prev.filter(i => i.id !== id);
          persistCart(next);
          return next;
        });
        showToast('Producto eliminado');
      };

      const checkoutViaWhatsApp = () => {
        if (cart.length === 0) { showToast('El carrito está vacío'); return; }
        if (!buyerDraft.name.trim() || !buyerDraft.phone.trim()) { showToast('Ingresa Nombre y WhatsApp para ordenar'); return; }

        const orderIds = [];
        cart.forEach(item => {
          const res = processSaleTransaction({
            coilId: item.id,
            qty: item.qty,
            customerName: buyerDraft.name.trim(),
            customerPhone: buyerDraft.phone.trim(),
            paymentRef: buyerDraft.payRef.trim() || 'Coordinar por WA',
            userId: deviceId
          });
          if (res) orderIds.push(res.orderId);
        });

        const itemsText = cart.map(i => `• ${i.qty}x ${i.name} ($${Number(i.price).toFixed(2)})`).join('\n');
        const totalVal = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);
        const orderTag = orderIds.join(', ') || 'ORD-WA';

        const msg = `⚡ *NUEVO PEDIDO CONFIRMADO (${orderTag}) - JF AUTO PARTS*\n\n` +
          `👤 *Cliente:* ${buyerDraft.name} (${buyerDraft.phone})\n` +
          `🚗 *Vehículo:* ${buyerDraft.car || 'Por especificar'}\n` +
          `💳 *Pago:* ${buyerDraft.payRef || 'A coordinar'}\n\n` +
          `📦 *Repuestos:*\n${itemsText}\n\n` +
          `💰 *Total:* $${totalVal.toFixed(2)} USD\n\n` +
          `✅ *Stock reservado en sistema.*`;

        const phone = normalizeWaPhone(ownerSettings.ownerPhone);
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        setCart([]);
        persistCart([]);
        setIsCartOpen(false);
      };

      const cartCount = cart.reduce((acc, curr) => acc + curr.qty, 0);
      const cartSubtotal = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);

      return (
        <CartContext.Provider value={{ cart, cartCount, cartSubtotal, isCartOpen, setIsCartOpen, toggleCart: () => setIsCartOpen(p => !p), closeCart: () => setIsCartOpen(false), addToCart, updateCartQty, removeFromCart, buyerDraft, updateBuyerDraft, checkoutViaWhatsApp }}>
          {children}
        </CartContext.Provider>
      );
    }

          let maxScore = 0;
          coils.forEach(item => {
            const h = `${item.id} ${item.name} ${item.brand} ${item.carModel} ${item.engine} ${item.oem}`.toLowerCase();
            let score = 0;
            tokens.forEach(tk => { if (h.includes(tk)) score += 3; });
            if (score > maxScore) { maxScore = score; bestMatch = item; }
          });

          const isBuy = clean.includes('comprar') || clean.includes('pago') || clean.includes('ref') || clean.includes('confirmo');
          let botHtml = '';
          let product = null;
          let badge = '';

          if (isBuy && bestMatch && bestMatch.stock > 0) {
            const ord = processSaleTransaction({ coilId: bestMatch.id, qty: 1, customerName: 'Cliente Chat WA', customerPhone: 'WhatsApp', paymentRef: text, userId: deviceId });
            badge = `[TX COMMIT ${getEngineLabel(dbEngine)}] Orden #${ord.orderId}`;
            botHtml = `🎉 <strong>¡VENTA CONFIRMADA! (#${ord.orderId})</strong><br><br>Descontamos 1x <strong>${bestMatch.name}</strong> del inventario:<br>• <strong>Total:</strong> <span class="text-emerald-400 font-bold">${formatUSD(bestMatch.price)} USD</span><br>${isAdmin ? `• <strong>Nuevo Stock DB:</strong> ${ord.stockBefore} ➔ <strong>${ord.stockAfter} uds</strong><br><br>` : `• <strong>Estado del Pedido:</strong> <span class="text-emerald-400 font-bold">Aprobado y en preparación para despacho</span><br><br>`}📲 <em>Alerta enviada al dueño al ${ownerSettings.ownerPhone}.</em>`;
            setLogs(prev => [{ id: Math.random().toString(), time, query: `TX COMMIT: #${ord.orderId} [${bestMatch.id}]`, count: 1, engine: getEngineLabel(dbEngine), latency: 25 }, ...prev]);
          } else if (bestMatch && maxScore > 0) {
            product = bestMatch;
            badge = `[${getEngineLabel(dbEngine)}] ID: ${bestMatch.id} | Stock: ${bestMatch.stock}`;
            if (bestMatch.stock > 0) {
              botHtml = `✅ ¡Sí, disponible en stock inmediato!<br><br>• <strong>${bestMatch.name}</strong><br>• <strong>Aplicación:</strong> ${bestMatch.carModel}<br>• <strong>Precio:</strong> <span class="text-brand-400 font-bold">${formatUSD(bestMatch.price)} USD</span><br>• <strong>Stock:</strong> <span class="text-emerald-400 font-bold">${bestMatch.stock} unidades</span><br>• <strong>OEM:</strong> <code>${bestMatch.oem}</code><br><br>Escribe <code>"Quiero comprar ref 12345"</code> o usa el botón abajo para cerrar tu compra.`;
            } else {
              botHtml = `⚠️ La <strong>${bestMatch.name}</strong> se encuentra temporalmente con <strong>Stock: 0 unidades</strong>.<br>Precio: ${formatUSD(bestMatch.price)} USD. ¿Deseas encargarla bajo pedido?`;
            }
            setLogs(prev => [{ id: Math.random().toString(), time, query: `SELECT * WHERE id='${bestMatch.id}'`, count: 1, engine: getEngineLabel(dbEngine), latency: 32 }, ...prev]);
          } else {
            badge = `[${getEngineLabel(dbEngine)}] 0 registros`;
            botHtml = isAdmin
              ? `Consulté la base de datos para <em>"${text}"</em> y no encontré un registro exacto.<br><br>💡 <em>Tip de Administrador: Puedes agregarla desde el panel de <strong>"Base de Datos & Stock"</strong>.</em>`
              : `No encontramos una coincidencia exacta en catálogo para <em>"${text}"</em>.<br><br>💡 Por favor verifica el año, modelo o código OEM, o escríbenos directamente por WhatsApp.`;
            setLogs(prev => [{ id: Math.random().toString(), time, query: `SELECT * WHERE name LIKE '%${tokens.join(' ')}%'`, count: 0, engine: getEngineLabel(dbEngine), latency: 18 }, ...prev]);
          }

          setMessages(prev => [...prev, { id: Math.random().toString(), sender: 'bot', html: botHtml, badge, product, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]);
        }, 500);
      };

      const handleResetChat = () => {
        setMessages([
          { 
            id: Math.random().toString(), 
            sender: 'bot', 
            html: `¡Hola! 👋 Historial reiniciado. Estoy listo para ayudarte. ¿Qué modelo o código OEM deseas consultar?`, 
            badge: `Conectado a ${getEngineLabel(dbEngine)} (${coils.length} bobinas)`, 
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
          }
        ]);
      };

      return (
        <div className={isAdmin && showAdminConsole ? "grid grid-cols-1 lg:grid-cols-3 gap-6" : "max-w-3xl mx-auto w-full"}>
          <div className={`${isAdmin && showAdminConsole ? "lg:col-span-2" : "w-full"} bg-slate-900 border border-slate-700/80 rounded-2xl flex flex-col h-[580px] overflow-hidden shadow-2xl relative`}>
            <div className="bg-[#075e54] text-white p-3.5 flex items-center justify-between shadow">
              <div className="flex items-center gap-3">
                <img src="./logo.png" alt="JF AUTO PARTS Logo" className="h-10 w-10 rounded-full object-cover border-2 border-emerald-400 shadow shrink-0" />
                <div>
                  <div className="font-bold text-sm">JF Auto Parts AI <i className="fa-solid fa-circle-check text-sky-300 text-xs"></i></div>
                  <p className="text-[10px] text-emerald-200">Oficial {ownerSettings.ownerPhone} • En línea</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {isAdmin && (
                  <button 
                    onClick={() => setShowAdminConsole(!showAdminConsole)}
                    className={`px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer border ${
                      showAdminConsole 
                        ? 'bg-sky-500/20 text-sky-300 border-sky-500/40 shadow-xs' 
                        : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
                    }`}
                    title="Mostrar/Ocultar Consola de Queries SQL para Administrador"
                  >
                    <i className="fa-solid fa-terminal text-[10px]"></i>
                    <span className="hidden sm:inline">{showAdminConsole ? 'Ocultar Consola' : 'Ver Consola SQL'}</span>
                  </button>
                )}
                <button 
                  onClick={handleResetChat}
                  className="p-2 text-emerald-200 hover:text-white hover:bg-emerald-700/50 rounded-lg text-xs transition cursor-pointer"
                  title="Reiniciar conversación"
                >
                  <i className="fa-solid fa-rotate-right"></i>
                </button>
              </div>
            </div>

            <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-[#0b141a]">
              {messages.map(m => (
                <div key={m.id} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                  {m.sender === 'user' ? (
                    <div className="relative bg-[#005c4b] text-[#e9edef] rounded-lg rounded-tr-none p-3 shadow max-w-[85%] chat-bubble-tail-out text-xs sm:text-sm">
                      <p>{m.text}</p>
                      <span className="block text-right text-[9px] text-gray-300 mt-1">{m.time} <i className="fa-solid fa-check-double text-sky-400"></i></span>
                    </div>
                  ) : (
                    <div className="relative bg-[#202c33] text-[#e9edef] rounded-lg rounded-tl-none p-3 shadow max-w-[85%] chat-bubble-tail-in text-xs sm:text-sm">
                      <div className="font-semibold text-brand-400 text-[10px] uppercase mb-1 flex items-center gap-1.5"><img src="./logo.png" alt="Logo" className="w-3.5 h-3.5 rounded-full object-cover inline-block" /> Asesor JF Auto Parts AI</div>
                      {isAdmin && m.badge && (
                        <div className="mb-2 px-2 py-0.5 bg-slate-800 rounded text-[9px] font-mono text-sky-400 border border-slate-700">
                          <i className="fa-solid fa-database mr-1"></i>{m.badge}
                        </div>
                      )}
                      <div dangerouslySetInnerHTML={{ __html: m.html }} />
                      {m.product && (
                        <div className="mt-3 pt-2.5 border-t border-slate-700/60 flex flex-wrap gap-2">
                          <button onClick={() => onTriggerSale(m.product)} className="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-[11px] flex items-center gap-1 shadow cursor-pointer">
                            <i className="fa-solid fa-cash-register"></i> Cerrar Venta en WA ({formatUSD(m.product.price)})
                          </button>
                        </div>
                      )}
                      <span className="block text-right text-[9px] text-gray-400 mt-1">{m.time}</span>
                    </div>
                  )}
                </div>
              ))}
              {isTyping && <div className="text-xs text-gray-400 italic">Consultando inventario...</div>}
              <div ref={endRef} />
            </div>

            <div className="p-3 bg-slate-900 border-t border-slate-800 flex items-center gap-2">
              <input type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') handleSend(); }} placeholder="Escribe tu consulta (Ej: ¿Tienen la bobina para Captiva 3.2?)..." className="flex-1 px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs sm:text-sm text-white focus:outline-none focus:border-emerald-500" />
              <button onClick={() => handleSend()} className="h-10 w-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center cursor-pointer"><i className="fa-solid fa-paper-plane"></i></button>
            </div>
          </div>

          {isAdmin && showAdminConsole && (
            <div className="bg-slate-950 border border-slate-800 rounded-2xl flex flex-col h-[580px] overflow-hidden p-3 font-mono text-[11px]">
              <div className="font-bold text-white mb-2 pb-2 border-b border-slate-800 flex items-center justify-between">
                <span><i className="fa-solid fa-terminal text-sky-400"></i> Monitor SQL en Vivo</span>
                <button onClick={() => setLogs([])} className="text-slate-500 hover:text-white text-[10px]">Limpiar</button>
              </div>
              <div className="flex-1 overflow-y-auto space-y-2">
                {logs.length === 0 ? (
                  <div className="text-slate-600 text-center py-10">Esperando queries...</div>
                ) : (
                  logs.map(l => (
                    <div key={l.id} className="p-2 bg-slate-900 rounded border border-slate-800 text-[10px] space-y-0.5">
                      <div className="text-emerald-400">{l.time} ({l.latency}ms)</div>
                      <div className="text-sky-300">&gt; {l.query}</div>
                      <div className="text-slate-400">Resultados: {l.count} filas</div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    function SalesView({ onOpenManualSale }) {
      const { salesHistory, confirmSale, revertSale, coils, processSaleTransaction, refreshSalesHistory, importSalesBatch } = useInventory();
      const [salesModalOpen, setSalesModalOpen] = useState(false);
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [modalTab, setModalTab] = useState('export'); // 'export' | 'import'
      const [csvInput, setCsvInput] = useState('');
      const [replaceAll, setReplaceAll] = useState(false);

      const handleQuickSimulation = () => {
        const available = coils.filter(b => b.stock > 0);
        const pick = available[0] || coils[0];
        if (!pick) return;
        processSaleTransaction({
          coilId: pick.id,
          qty: 1,
          customerName: 'Cliente Rápido Simulador',
          customerPhone: '0412-5558900',
          paymentRef: `Pago Móvil Ref #${Math.floor(100000 + Math.random() * 900000)}`,
          userId: 'CLI-SIMULATED'
        });
      };

      const handleRefresh = () => {
        setIsRefreshing(true);
        refreshSalesHistory();
        setTimeout(() => setIsRefreshing(false), 500);
      };

      const exportCSV = () => {
        const headers = ['order_id','fecha_hora','cliente_nombre','cliente_telefono','producto_id','producto_nombre','codigo_oem','marca_producto','modelo_vehiculo','cantidad','precio_unitario_usd','total_usd','stock_actual_catalogo','referencia_pago','estado_orden'];
        const rows = salesHistory.map(s => {
          const coil = coils.find(c => c.id === s.coilId || (s.oem && c.oem && c.oem.includes(s.oem)));
          return [
            s.orderId || '',
            s.timestamp || '',
            s.customerName || 'Cliente General',
            s.customerPhone || '',
            coil ? coil.id : (s.coilId || ''),
            coil ? coil.name : (s.coilName || ''),
            coil ? coil.oem : (s.oem || ''),
            coil ? coil.brand : '',
            coil ? coil.carModel : '',
            s.qty || 1,
            Number(s.unitPrice || 0).toFixed(2),
            Number(s.totalPrice || 0).toFixed(2),
            coil ? coil.stock : (s.stockAfter ?? ''),
            s.paymentRef || '',
            s.status || 'CONFIRMED'
          ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(',');
        });
        const content = [headers.join(','), ...rows].join('\n');
        downloadFile(content, `jf_autoparts_ventas_supabase_${Date.now()}.csv`, 'text/csv;charset=utf-8;');
      };

      const exportSQL = () => {
        const safe = str => String(str ?? '').replace(/'/g, "''");
        const inserts = salesHistory.map(s => {
          const coil = coils.find(c => c.id === s.coilId || (s.oem && c.oem && c.oem.includes(s.oem)));
          return `INSERT INTO public.ventas (order_id, fecha, cliente_nombre, producto_id, producto_nombre, codigo_oem, cantidad, precio_unitario, total_usd, stock_actual_catalogo, referencia_pago, estado, status) VALUES ('${safe(s.orderId)}', '${safe(s.timestamp)}', '${safe(s.customerName)}', '${safe(coil ? coil.id : s.coilId)}', '${safe(coil ? coil.name : s.coilName)}', '${safe(coil ? coil.oem : s.oem)}', ${Number(s.qty || 1)}, ${Number(s.unitPrice || 0).toFixed(2)}, ${Number(s.totalPrice || 0).toFixed(2)}, ${Number(coil ? coil.stock : 0)}, '${safe(s.paymentRef)}', '${safe(s.status || 'CONFIRMED')}', '${safe(s.status || 'CONFIRMED')}');`;
        }).join('\n');
        const sql = `-- DDL TABLA VENTAS & CATÁLOGO SUPABASE (JF AUTO PARTS)\nCREATE TABLE IF NOT EXISTS public.bobinas_inventario (\n  id TEXT PRIMARY KEY,\n  name TEXT NOT NULL,\n  brand TEXT,\n  car_model TEXT,\n  engine TEXT,\n  oem TEXT,\n  price NUMERIC(10,2) NOT NULL DEFAULT 25.00,\n  stock INTEGER NOT NULL DEFAULT 0\n);\n\n-- Asegurar restricción UNIQUE en bobinas_inventario(id) para permitir clave foránea (Corrige error 42830):\nDO $$\nBEGIN\n  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid = 'public.bobinas_inventario'::regclass AND (conname IN ('bobinas_inventario_pkey', 'bobinas_inventario_id_unique') OR contype = 'p')) THEN\n    ALTER TABLE public.bobinas_inventario ADD CONSTRAINT bobinas_inventario_id_unique UNIQUE (id);\n  END IF;\nEND $$;\n\nCREATE TABLE IF NOT EXISTS public.ventas (\n  id BIGSERIAL PRIMARY KEY,\n  order_id TEXT NOT NULL UNIQUE,\n  fecha TEXT,\n  cliente_nombre TEXT,\n  producto_id TEXT,\n  producto_nombre TEXT,\n  codigo_oem TEXT,\n  cantidad INTEGER DEFAULT 1,\n  precio_unitario NUMERIC(10,2),\n  total_usd NUMERIC(10,2),\n  stock_actual_catalogo INTEGER,\n  referencia_pago TEXT,\n  estado TEXT DEFAULT 'CONFIRMED',\n  status TEXT DEFAULT 'CONFIRMED'\n);\n\n-- Asegurar columnas si la tabla ya existía (Corrige error PGRST204):\nALTER TABLE public.ventas ADD COLUMN IF NOT EXISTS estado TEXT DEFAULT 'CONFIRMED';\nALTER TABLE public.ventas ADD COLUMN IF NOT EXISTS status TEXT DEFAULT 'CONFIRMED';\nALTER TABLE public.ventas ADD COLUMN IF NOT EXISTS producto_id TEXT;\nALTER TABLE public.ventas ADD COLUMN IF NOT EXISTS producto_nombre TEXT;\nALTER TABLE public.ventas ADD COLUMN IF NOT EXISTS codigo_oem TEXT;\nALTER TABLE public.ventas ADD COLUMN IF NOT EXISTS stock_actual_catalogo INTEGER;\n\n-- Vincular clave foránea con el catálogo:\nDO $$\nBEGIN\n  IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'fk_ventas_producto_catalogo') THEN\n    ALTER TABLE public.ventas ADD CONSTRAINT fk_ventas_producto_catalogo FOREIGN KEY (producto_id) REFERENCES public.bobinas_inventario(id) ON DELETE SET NULL;\n  END IF;\nEND $$;\n\nALTER TABLE public.bobinas_inventario DISABLE ROW LEVEL SECURITY;\nALTER TABLE public.ventas DISABLE ROW LEVEL SECURITY;\nNOTIFY pgrst, 'reload schema';\n\n${inserts}`;
        downloadFile(sql, `jf_autoparts_ventas_supabase_${Date.now()}.sql`, 'application/sql;charset=utf-8;');
      };

      const handleImportCSV = () => {
        if (!csvInput.trim()) return;
        const lines = csvInput.trim().split(/\r?\n/);
        if (lines.length < 2) return;
        const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase());
        const imported = lines.slice(1).map((line, idx) => {
          const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
          const row = {};
          headers.forEach((h, i) => { row[h] = cols[i] || ''; });
          const rawId = row.producto_id || row.coilid || row.id || '';
          const rawOem = row.codigo_oem || row.oem || '';
          const rawName = row.producto_nombre || row.coilname || row.nombre || '';
          const coil = coils.find(c => (rawId && c.id.toLowerCase() === rawId.toLowerCase()) || (rawOem && c.oem.includes(rawOem)) || (rawName && c.name.toLowerCase().includes(rawName.toLowerCase())));
          const qty = parseInt(row.cantidad || row.qty || 1, 10);
          const price = parseFloat(row.precio_unitario || row.unitprice || (coil ? coil.price : 30));
          return {
            orderId: String(row.order_id || row.orderid || `ORD-${Date.now().toString().slice(-4)}${idx}`).replace(/^#/, ''),
            timestamp: row.fecha_hora || row.fecha || 'Hoy',
            customerName: row.cliente_nombre || row.cliente || 'Cliente Importado',
            customerPhone: row.cliente_telefono || '',
            coilId: coil ? coil.id : (rawId || 'BOB-GEN'),
            coilName: coil ? coil.name : (rawName || 'Bobina'),
            oem: coil ? coil.oem : rawOem,
            qty,
            unitPrice: price,
            totalPrice: parseFloat(row.total_usd || row.totalprice || (price * qty)),
            stockBefore: coil ? coil.stock + qty : 10,
            stockAfter: coil ? coil.stock : 10,
            paymentRef: row.referencia_pago || 'Pago Registrado',
            status: 'CONFIRMED'
          };
        });
        importSalesBatch(imported, replaceAll);
        setSalesModalOpen(false);
        setCsvInput('');
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <h2 className="text-xl sm:text-2xl font-extrabold text-white">Auditoría de Ventas & Despachos</h2>
              <p className="text-xs text-slate-400">Descuento automático de stock con alertas al WhatsApp del dueño (0412-6497478).</p>
            </div>
            
            <div className="flex flex-wrap items-center gap-2">
              <button onClick={onOpenManualSale} className="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 cursor-pointer shadow">
                <i className="fa-solid fa-plus"></i> Registrar Venta Manual
              </button>

              <button onClick={handleQuickSimulation} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-semibold flex items-center gap-1.5 cursor-pointer">
                <i className="fa-solid fa-bolt text-amber-400"></i> Simular Venta Rápida WA
              </button>

              {/* Botón: Actualizar registro de ventas */}
              <button onClick={handleRefresh} disabled={isRefreshing} className="px-3 py-2 bg-sky-950 hover:bg-sky-900 text-sky-300 border border-sky-500/40 rounded-xl text-xs font-bold flex items-center gap-1.5 cursor-pointer shadow-sm active:scale-95" title="Actualizar registro de ventas realizadas">
                <i className={`fa-solid fa-arrows-rotate ${isRefreshing ? 'fa-spin' : ''} text-sky-400`}></i>
                <span>Actualizar Registro</span>
              </button>

              {/* Botón: Base de Datos CSV & Supabase */}
              <button onClick={() => setSalesModalOpen(true)} className="px-3 py-2 bg-gradient-to-r from-emerald-700 to-teal-700 hover:from-emerald-600 hover:to-teal-600 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 cursor-pointer shadow-lg active:scale-95" title="Importar y Exportar CSV conectado al catálogo para Supabase">
                <i className="fa-solid fa-file-csv text-emerald-200"></i>
                <span>Base de Datos CSV (Supabase)</span>
              </button>
            </div>
          </div>

          <div className="bg-slate-900 border border-slate-700/80 rounded-2xl overflow-hidden shadow-xl">
            <table className="w-full text-left text-xs text-slate-300">
              <thead className="bg-slate-950 text-slate-400 uppercase text-[10px] font-mono">
                <tr>
                  <th className="py-3 px-4">Orden</th>
                  <th className="py-3 px-4">Hora</th>
                  <th className="py-3 px-4">Cliente</th>
                  <th className="py-3 px-4">Bobina</th>
                  <th className="py-3 px-4">Total</th>
                  <th className="py-3 px-4">Stock (Antes ➔ Ahora)</th>
                  <th className="py-3 px-4">Estado</th>
                  <th className="py-3 px-4 text-right">Acción</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800">
                {salesHistory.map(ord => (
                  <tr key={ord.orderId} className="hover:bg-slate-800/50">
                    <td className="py-3 px-4 font-mono font-bold text-brand-400">#{ord.orderId}</td>
                    <td className="py-3 px-4 text-slate-400">{ord.timestamp}</td>
                    <td className="py-3 px-4 text-white">{ord.customerName}</td>
                    <td className="py-3 px-4">{ord.qty}x {ord.coilName}</td>
                    <td className="py-3 px-4 text-emerald-400 font-bold">{formatUSD(ord.totalPrice)}</td>
                    <td className="py-3 px-4 font-mono text-[11px]">
                      {ord.status === 'PENDING_APPROVAL' ? (
                        <span className="text-amber-300 font-semibold">{ord.stockBefore} uds (-{ord.qty} al confirmar)</span>
                      ) : ord.status === 'REVERTED' ? (
                        <span className="text-slate-400">{ord.stockBefore} uds (Revertida)</span>
                      ) : (
                        <span>{ord.stockBefore} ➔ <span className="text-emerald-400 font-bold">{ord.stockAfter} uds</span></span>
                      )}
                    </td>
                    <td className="py-3 px-4">
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${ord.status === 'CONFIRMED' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : ord.status === 'PENDING_APPROVAL' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30 animate-pulse' : 'bg-rose-500/20 text-rose-400 border border-rose-500/30'}`}>
                        {ord.status === 'PENDING_APPROVAL' ? 'PENDIENTE' : ord.status === 'CONFIRMED' ? 'CONFIRMADA' : 'REVERTIDA'}
                      </span>
                    </td>
                    <td className="py-3 px-4 text-right space-x-1">
                      {ord.status === 'PENDING_APPROVAL' && (
                        <>
                          <button onClick={() => confirmSale(ord.orderId)} className="px-2 py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs" title="Confirmar venta y descontar stock">
                            <i className="fa-solid fa-check"></i> Confirmar
                          </button>
                          <button onClick={() => revertSale(ord.orderId)} className="px-1.5 py-1 bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 rounded-lg text-xs" title="Cancelar orden">
                            <i className="fa-solid fa-ban"></i>
                          </button>
                        </>
                      )}
                      {ord.status === 'CONFIRMED' && (
                        <button onClick={() => revertSale(ord.orderId)} className="text-rose-400 hover:text-rose-300 text-xs p-1" title="Revertir venta">
                          <i className="fa-solid fa-rotate-left"></i> Revertir
                        </button>
                      )}

    function AuthModal() {
      const { authModalOpen, closeAuthModal, login, authLockReason } = useAuth();
      const [u, setU] = useState('admin');
      const [p, setP] = useState('');
      const [showP, setShowP] = useState(false);
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        setP('');
        setShowP(false);
      }, [authModalOpen]);

      if (!authModalOpen) return null;

      const handleLogin = async () => {
        setLoading(true);
        const passVal = p;
        setP('');
        setShowP(false);
        try {
          await login(u, passVal);
        } finally {
          setLoading(false);
          setP('');
          setShowP(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full space-y-4">
            <div className="text-center">
              <img src="./logo.png" alt="JF AUTO PARTS Logo" className="h-14 w-14 rounded-xl object-cover mx-auto mb-2 border border-slate-700 shadow-md" />
              <h3 className="text-base font-bold text-white"><i className="fa-solid fa-shield-halved text-emerald-400 mr-1.5"></i> Acceso Administrador Seguro</h3>
              <p className="text-[11px] text-slate-400">Protegido con Cifrado SHA-256</p>
            </div>
            {authLockReason && <p className="text-xs text-rose-300 bg-rose-500/10 p-2.5 rounded-lg border border-rose-500/20">{authLockReason}</p>}
            <input type="text" value={u} onChange={e => setU(e.target.value)} placeholder="Usuario autorizado" className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white" />
            <div className="relative">
              <input type={showP ? 'text' : 'password'} value={p} onChange={e => setP(e.target.value)} placeholder="Ingresa tu contraseña" autoComplete="new-password" className="w-full pl-3 pr-10 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white font-mono" />
              <button type="button" onClick={() => setShowP(!showP)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs cursor-pointer">
                <i className={"fa-solid " + (showP ? "fa-eye-slash" : "fa-eye")}></i>
              </button>
            </div>
            <button disabled={loading} onClick={handleLogin} className="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-xl text-xs cursor-pointer shadow flex items-center justify-center gap-2">
              {loading ? <i className="fa-solid fa-circle-notch animate-spin"></i> : <i className="fa-solid fa-key"></i>}
              <span>{loading ? 'Verificando Hash...' : 'Ingresar'}</span>
            </button>
            <button onClick={() => { setP(""); setShowP(false); closeAuthModal(); }} className="w-full text-xs text-slate-400 hover:text-white">Cancelar</button>
          </div>
        </div>
      );
    }

    function ProductModalStandalone({ isOpen, onClose, initialProduct }) {
      const { coils, upsertCoil, deleteCoil } = useInventory();
      const [confirmDelete, setConfirmDelete] = useState(false);
      const fileInputRef = useRef(null);

      const isEditing = Boolean(initialProduct && initialProduct.id);

      const [form, setForm] = useState({
        id: '',
        category: 'bobina',
        name: '',
        brand: 'Chevrolet',
        carModel: '',
        engine: '',
        oem: '',
        type: 'Tipo Lápiz Individual (COP)',
        connector: 'Conector 4 Pines',
        price: '29.50',
        oldPrice: '',
        stock: '15',
        warranty: '12 meses',
        badge: 'OEM Spec',
        image: ''
      });
      const [idAutoGenerated, setIdAutoGenerated] = useState(true);

      const prevOpenRef = useRef(false);
      const prevProductIdRef = useRef(null);

      useEffect(() => {
        if (isOpen) {
          const currentId = initialProduct?.id || null;
          const justOpened = !prevOpenRef.current;
          const changedProduct = currentId !== prevProductIdRef.current;

          if (justOpened || changedProduct) {
            if (initialProduct && initialProduct.id) {
              const detectedCat = initialProduct.category || detectProductCategory(initialProduct);
              setForm({
                id: String(initialProduct.id || ''),
                category: detectedCat,
                name: String(initialProduct.name || ''),
                brand: String(initialProduct.brand || 'Chevrolet'),
                carModel: String(initialProduct.carModel || ''),
                engine: String(initialProduct.engine || ''),
                oem: String(initialProduct.oem || ''),
                type: String(initialProduct.type || ''),
                connector: String(initialProduct.connector || ''),
                price: String(initialProduct.price ?? '29.50'),
                oldPrice: String(initialProduct.oldPrice || ''),
                stock: String(initialProduct.stock ?? '15'),
                warranty: String(initialProduct.warranty || '12 meses'),
                badge: String(initialProduct.badge || 'OEM Spec'),
                image: String(initialProduct.image || '')
              });
              setIdAutoGenerated(false);
            } else {
              const defaultCat = 'bobina';
              const defaultBrand = 'Chevrolet';
              const cfg = getCategoryConfig(defaultCat);
              const autoId = generateSmartProductId({
                category: defaultCat,
                brand: defaultBrand,
                existingItems: coils
              });
              setForm({
                id: autoId,
                category: defaultCat,
                name: '',
                brand: defaultBrand,
                carModel: '',
                engine: '',
                oem: '',
                type: cfg.defaultType,
                connector: cfg.defaultConnector,
                price: '29.50',
                oldPrice: '',
                stock: '10',
                warranty: '12 meses',
                badge: 'OEM Spec',
                image: ''
              });
              setIdAutoGenerated(true);
            }
          }
        }
        prevOpenRef.current = isOpen;
        prevProductIdRef.current = initialProduct?.id || null;
      }, [isOpen, initialProduct?.id]);

      if (!isOpen) return null;

      const currentCategory = getCategoryConfig(form.category);

      const handleChange = (field, value) => {
        setForm(prev => {
          const next = { ...prev, [field]: value };
          if (!isEditing && idAutoGenerated && ['name', 'brand', 'carModel', 'engine'].includes(field)) {
            next.id = generateSmartProductId({
              category: next.category,
              name: field === 'name' ? value : next.name,
              brand: field === 'brand' ? value : next.brand,
              carModel: field === 'carModel' ? value : next.carModel,
              engine: field === 'engine' ? value : next.engine,
              existingItems: coils
            });
          }
          return next;
        });
      };

      const handleCategorySelect = (newCatId) => {
        const newCfg = getCategoryConfig(newCatId);
        setForm(prev => {
          const isDefaultType = !prev.type || PRODUCT_CATEGORIES.some(c => c.defaultType === prev.type);
          const isDefaultConnector = !prev.connector || PRODUCT_CATEGORIES.some(c => c.defaultConnector === prev.connector);
          const next = {
            ...prev,
            category: newCatId,
            type: isDefaultType ? newCfg.defaultType : prev.type,
            connector: isDefaultConnector ? newCfg.defaultConnector : prev.connector
          };
          if (!isEditing && idAutoGenerated) {
            next.id = generateSmartProductId({
              category: newCatId,
              name: next.name,
              carModel: next.carModel,
              engine: next.engine,
              brand: next.brand,
              existingItems: coils
            });
          }
          return next;
        });
      };

      const handleRegenId = () => {
        const fresh = generateSmartProductId({
          category: form.category,
          name: form.name,
          carModel: form.carModel,
          engine: form.engine,
          brand: form.brand,
          existingItems: coils
        });
        setForm(p => ({ ...p, id: fresh }));
        setIdAutoGenerated(true);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) { alert('La foto debe pesar menos de 8MB'); return; }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 800;
            let { width, height } = img;
            if (width > maxDim || height > maxDim) {
              if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
              else { width = Math.round((width * maxDim) / height); height = maxDim; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            setForm(prev => ({ ...prev, image: canvas.toDataURL('image/jpeg', 0.75) }));
          };
          img.onerror = () => setForm(prev => ({ ...prev, image: ev.target.result }));
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleRemoveImage = () => {
        setForm(prev => ({ ...prev, image: '' }));
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const handleSave = (e) => {
        e.preventDefault();
        upsertCoil(form);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-xs flex items-center justify-center p-3 sm:p-5 animate-fade-in">
          <div className="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-xl w-full shadow-2xl relative my-auto flex flex-col max-h-[92vh] overflow-hidden">
            
            {/* Sticky Header */}
            <div className="px-5 py-4 border-b border-slate-800 flex items-center justify-between shrink-0 bg-slate-900 z-10">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl flex items-center justify-center bg-slate-800 border border-slate-700 shadow-xs">
                  <i className={`text-base ${isEditing ? 'fa-solid fa-pen-to-square text-sky-400' : `${currentCategory.icon} ${currentCategory.color}`}`}></i>
                </div>
                <div>
                  <h3 className="text-sm sm:text-base font-bold text-white leading-tight flex items-center gap-2">
                    <span>{isEditing ? `Editar Repuesto` : `Registrar Nuevo Repuesto`}</span>
                    <span className="font-mono text-xs px-2 py-0.5 rounded bg-brand-500/20 text-brand-400 border border-brand-500/30">
                      {form.id || 'NUEVO'}
                    </span>
                  </h3>
                  <p className="text-[11px] text-slate-400 mt-0.5">{currentCategory.name} • {form.brand || 'Automotriz'}</p>
                </div>
              </div>
              <button 
                type="button" 
                onClick={onClose} 
                className="w-8 h-8 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition flex items-center justify-center cursor-pointer border border-slate-700"
              >
                <i className="fa-solid fa-xmark text-sm"></i>
              </button>
            </div>

            {/* Scrollable Body */}
            <form onSubmit={handleSave} className="flex-1 overflow-y-auto p-5 space-y-4">
              
              {/* Category Selector Bar */}
              <div className="p-3 bg-slate-800/90 border border-slate-700 rounded-xl space-y-2">
                <div className="flex items-center justify-between">
                  <label className="text-[11px] font-bold text-brand-400 flex items-center gap-1.5 uppercase tracking-wider">
                    <i className="fa-solid fa-layer-group"></i> Categoría del Repuesto *
                  </label>
                  <span className="text-[10px] text-slate-400 font-mono">
                    Prefijo: <strong className="text-white">{currentCategory.prefix}-</strong>
                  </span>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-1.5">
                  {PRODUCT_CATEGORIES.map(cat => {
                    const isSelected = form.category === cat.id;
                    return (
                      <button
                        key={cat.id}
                        type="button"
                        onClick={() => handleCategorySelect(cat.id)}
                        className={`px-2 py-1.5 rounded-lg text-[11px] font-semibold flex items-center gap-1.5 transition cursor-pointer border text-left ${
                          isSelected
                            ? 'bg-brand-500 text-white border-brand-400 shadow-sm'
                            : 'bg-slate-900/90 hover:bg-slate-700 text-slate-300 border-slate-700/80'
                        }`}
                      >
                        <i className={`${cat.icon} text-xs ${isSelected ? 'text-white' : cat.color}`}></i>
                        <span className="truncate">{cat.name.split(' ')[0]}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Image Upload Box */}
              <div className="p-3.5 bg-slate-800/80 border border-slate-700 rounded-xl space-y-3">
                <div className="flex items-center justify-between text-[11px] font-semibold text-slate-300">
                  <span className="flex items-center gap-1.5"><i className="fa-solid fa-camera text-brand-400"></i> Foto / Imagen del Producto</span>
                  {form.image && (
                    <button type="button" onClick={handleRemoveImage} className="px-2 py-0.5 rounded bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 hover:text-rose-300 border border-rose-500/30 text-[10px] font-bold flex items-center gap-1.5 cursor-pointer transition">
                      <i className="fa-solid fa-trash-can text-[10px]"></i> Eliminar Foto
                    </button>
                  )}
                </div>

                {form.image ? (
                  <div className="relative w-full h-44 rounded-xl bg-white border border-slate-700 overflow-hidden flex items-center justify-center p-3 shadow-inner group">
                    <img src={form.image} alt="Preview" className="max-h-full max-w-full w-auto h-auto object-contain mx-auto transition-transform duration-300 drop-shadow-sm" onError={e => { e.currentTarget.style.display = 'none'; }} />
                    <button
                      type="button"
                      onClick={handleRemoveImage}
                      className="absolute top-2 right-2 px-2.5 py-1 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-[11px] font-bold shadow-lg flex items-center gap-1 cursor-pointer transition"
                    >
                      <i className="fa-solid fa-trash-can text-[10px]"></i> Quitar
                    </button>
                    <div className="absolute bottom-2 left-2 px-2 py-0.5 rounded bg-black/80 text-[10px] text-slate-300 font-mono border border-slate-700 pointer-events-none">
                      Vista Previa Adaptada
                    </div>
                  </div>
                ) : (
                  <div className="w-full h-24 rounded-xl bg-slate-950/60 border border-dashed border-slate-700 flex flex-col items-center justify-center text-slate-500 text-center p-3">
                    <i className={`${currentCategory.icon} text-2xl mb-1 text-slate-600`}></i>
                    <span className="text-[11px] font-medium text-slate-400">Sin foto asignada</span>
                    <span className="text-[10px] text-slate-500">Sube una foto o pega una URL abajo</span>
                  </div>
                )}

                <div className="space-y-2 pt-1">
                  <div className="flex items-center gap-2">
                    <input type="file" ref={fileInputRef} accept="image/*" onChange={handleFileUpload} className="hidden" id="sa-photo-upload" />
                    <label htmlFor="sa-photo-upload" className="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-xs font-semibold cursor-pointer border border-slate-600 shadow-xs">
                      <i className="fa-solid fa-arrow-up-from-bracket text-sky-400 mr-1"></i> Subir archivo...
                    </label>
                    <span className="text-[10px] text-slate-400">JPG, PNG o WEBP (máx. 3MB)</span>
                  </div>
                  <input type="url" value={form.image} onChange={e => handleChange('image', e.target.value)} placeholder="O pegar URL de imagen (https://...)" className="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-[11px] text-slate-200 font-mono" />
                </div>
              </div>

              {/* ID & Brand */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <div className="flex items-center justify-between mb-1">

                      <button type="button" onClick={handleRegenId} className="text-[10px] text-brand-400 hover:text-brand-300 font-bold flex items-center gap-1 cursor-pointer">
                        <i className="fa-solid fa-wand-magic-sparkles text-[9px]"></i> Auto-generar
                      </button>

                  <div className="relative">

                    {!isEditing && idAutoGenerated && (
                      <span className="absolute right-2 top-2 text-[9px] bg-brand-500/20 text-brand-400 border border-brand-500/30 px-1.5 py-0.5 rounded font-mono font-bold">Auto</span>
                    )}
                  </div>
                  <p className="text-[10px] text-slate-500 mt-0.5">{currentCategory.prefix}-[MODELO][MOTOR]</p>
                </div>
                <div>
                  <label className="block text-[11px] font-semibold text-slate-400 mb-1">Marca de Auto *</label>
                  <input type="text" value={form.brand} onChange={e => handleChange('brand', e.target.value)} placeholder="Chevrolet, Toyota, Ford..." className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white" required />
                </div>

              <div>
