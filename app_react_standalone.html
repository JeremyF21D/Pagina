                <div>
                  <label className="block text-[11px] font-semibold text-slate-400 mb-1">Modelos Compatibles *</label>
                  <input type="text" value={form.carModel} onChange={e => handleChange('carModel', e.target.value)} placeholder="Ej: Aveo, Optra, Tiida..." className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white" required />
                </div>
                <div>
                  <label className="block text-[11px] font-semibold text-slate-400 mb-1">Motor / Cilindrada *</label>
                  <input type="text" value={form.engine} onChange={e => handleChange('engine', e.target.value)} placeholder="Ej: 1.6L, 1.8L, 2.0L..." className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white font-mono" required />
                </div>
              </div>

              <div>
                <label className="block text-[11px] font-semibold text-slate-400 mb-1">Código OEM *</label>
                <input type="text" value={form.oem} onChange={e => handleChange('oem', e.target.value)} placeholder="12618542 / UF569 / 96414260" className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white font-mono" required />
              </div>

              {/* Dynamic Specs */}
              <div className="grid grid-cols-2 gap-3 p-3 bg-slate-850 border border-slate-700 rounded-xl">
                <div>
                  <label className="block text-[11px] font-semibold text-slate-300 mb-1">{currentCategory.typeLabel}</label>
                  <input type="text" value={form.type} onChange={e => handleChange('type', e.target.value)} placeholder={currentCategory.typePlaceholder} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white" />
                </div>
                <div>
                  <label className="block text-[11px] font-semibold text-slate-300 mb-1">{currentCategory.connectorLabel}</label>
                  <input type="text" value={form.connector} onChange={e => handleChange('connector', e.target.value)} placeholder={currentCategory.connectorPlaceholder} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white" />
                </div>
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div>
                  <label className="block text-[11px] font-semibold text-slate-400 mb-1">Precio USD ($) *</label>
                  <input type="number" step="0.01" value={form.price} onChange={e => handleChange('price', e.target.value)} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white font-mono" required />
                </div>
                <div>
                  <label className="block text-[11px] font-semibold text-slate-400 mb-1">Precio Tachado</label>
                  <input type="number" step="0.01" value={form.oldPrice} onChange={e => handleChange('oldPrice', e.target.value)} placeholder="Opcional" className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white font-mono" />
                </div>
                <div>
                  <label className="block text-[11px] font-semibold text-slate-400 mb-1">Stock *</label>
                  <input type="number" value={form.stock} onChange={e => handleChange('stock', e.target.value)} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white font-mono" required />
                </div>
              </div>
            </form>

            {/* Sticky Footer */}
            <div className="px-5 py-3.5 border-t border-slate-800 flex items-center justify-between gap-2 shrink-0 bg-slate-900 z-10">
              {isEditing ? (
                <button 
                  type="button" 
                  onClick={() => { 
                    if (!confirmDelete) {
                      setConfirmDelete(true);
                      setTimeout(() => setConfirmDelete(false), 3500);
                      return;
                    }
                    deleteCoil(form.id); 
                    onClose(); 
                  }} 
                  className={`px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer ${
                    confirmDelete 
                      ? 'bg-rose-600 hover:bg-rose-700 text-white shadow-lg' 
                      : 'bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/30'
                  }`}
                >
                  <i className="fa-solid fa-trash-can text-xs"></i>
                  <span>{confirmDelete ? '¿Confirmar eliminar?' : 'Eliminar'}</span>
                </button>
              ) : <div></div>}
              <div className="flex gap-2">
                <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold cursor-pointer border border-slate-700">
                  Cancelar
                </button>
                <button type="button" onClick={handleSave} className="px-5 py-2 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-xl text-xs shadow-lg shadow-brand-500/20 cursor-pointer">
                  {isEditing ? 'Guardar Cambios' : 'Insertar en Base de Datos'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [tab, setTab] = useState('catalog');
      const [initialPrompt, setInitialPrompt] = useState('');
      const [editCoil, setEditCoil] = useState(null);
      const [createModal, setCreateModal] = useState(false);
      const [bulkModal, setBulkModal] = useState(false);
      const [bulkText, setBulkText] = useState('');
      const { upsertCoil, deleteCoil, bulkImport } = useInventory();

      return (
        <div className="flex flex-col min-h-screen">
          <TopNoticeBar />
          <Header activeTab={tab} setActiveTab={setTab} />
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            {tab === 'catalog' && (
              <CatalogView
                onNavigateTab={setTab}
                onAskAI={coil => { setInitialPrompt(`¿Tienen la bobina de ${coil.name}?`); setTab('simulator'); }}
                onEdit={c => setEditCoil(c)}
              />
            )}
            {tab === 'simulator' && (
              <SimulatorView initialPrompt={initialPrompt} onTriggerSale={c => { setTab('sales'); }} />
            )}
            {tab === 'sales' && <SalesView onOpenManualSale={() => setTab('catalog')} />}
            {tab === 'database' && (
              <DatabaseView
                onOpenCreate={() => setCreateModal(true)}
                onOpenEdit={c => setEditCoil(c)}
                onOpenBulk={() => setBulkModal(true)}
                onOpenSchema={() => {}}
              />
            )}
            {tab === 'admin' && <AdminConfigView />}
          </main>

          <footer className="bg-slate-950 border-t border-slate-800 py-6 text-center text-xs text-slate-500 flex flex-col items-center justify-center gap-2">
            <div className="flex items-center gap-2">
              <img src="./logo.png" alt="JF AUTO PARTS Logo" className="h-6 w-6 rounded-md object-cover border border-slate-800" />
              <span className="text-white font-semibold">JF Auto Parts &copy; {new Date().getFullYear()}</span>
            </div>
            <div>
              <a
                href="https://wa.me/584126497478"
                target="_blank"
                rel="noopener noreferrer"
                className="text-emerald-400 hover:text-emerald-300 font-semibold underline"
              >
                WhatsApp Oficial
              </a>{' '}
              • Especialistas en Encendido & Repuestos Automotrices
            </div>
          </footer>

          <CartDrawer />
          <AuthModal />

          {/* Modal Edición / Creación Completa con Foto y Auto-ID */}
          <ProductModalStandalone
            isOpen={createModal || Boolean(editCoil)}
            onClose={() => { setCreateModal(false); setEditCoil(null); }}
            initialProduct={editCoil}
          />

          {/* Modal Carga Masiva */}
          {bulkModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-lg w-full space-y-3">
                <h3 className="text-sm font-bold text-white">Carga Masiva (CSV / JSON)</h3>
                <textarea rows={8} value={bulkText} onChange={e => setBulkText(e.target.value)} placeholder="Pega aquí tu CSV o JSON..." className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded text-xs text-white font-mono" />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setBulkModal(false)} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs">Cancelar</button>
                  <button onClick={() => {
                    try {
                      let recs = [];
                      if (bulkText.trim().startsWith('[') || bulkText.trim().startsWith('{')) recs = JSON.parse(bulkText);
                      else recs = parseCSV(bulkText);
                      bulkImport(recs, false);
                      setBulkModal(false);
                    } catch(e) { alert('Error: ' + e.message); }
                  }} className="px-4 py-1.5 bg-sky-600 text-white font-bold rounded text-xs">Importar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ToastProvider>
        <AuthProvider>
          <InventoryProvider>
            <CartProvider>
              <App />
            </CartProvider>
          </InventoryProvider>
        </AuthProvider>
      </ToastProvider>
    );
  </script>
</body>
</html>
